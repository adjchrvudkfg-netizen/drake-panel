<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRAKE - Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="mobile-container">
    <div class="header">
      <h1>HOME</h1>
      <div class="header-icons">
        <button class="icon-btn">🔔</button>
        <button class="icon-btn">🌐 EN</button>
      </div>
    </div>

    <div class="content">
      <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-bottom: 20px;">
        <span>■ OFFLINE</span>
        <span>LAST REFRESHED JUST NOW</span>
      </div>

      <!-- Live Countdown Ring Timer -->
      <div style="display: flex; justify-content: center; margin-bottom: 24px; position: relative;">
        <svg width="220" height="220" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="85" stroke="#1c2029" stroke-width="6" fill="none" />
          <circle cx="100" cy="100" r="85" stroke="#ffffff" stroke-width="6" fill="none" stroke-dasharray="534" stroke-dashoffset="120" stroke-linecap="round" />
        </svg>
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;">
          <svg width="40" height="40" viewBox="0 0 100 100" fill="none">
            <path d="M50 10 C30 10 15 25 15 50 L15 85 L27 75 L38 85 L50 75 L62 85 L73 75 L85 85 L85 50 C85 25 70 10 50 10 Z" fill="#E0E0E0"/>
          </svg>
          <div style="font-family: 'Teko', sans-serif; font-size: 30px; line-height: 1; margin-top: 6px;" id="timeLeft">--</div>
          <div style="font-size: 10px; color: var(--text-sub); letter-spacing: 2px;">TIME LEFT</div>
        </div>
      </div>

      <!-- Active Key Details -->
      <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <div style="font-size: 10px; color: var(--text-sub);">KEY</div>
          <div style="font-weight: 700; font-size: 14px; letter-spacing: 1px;" id="userKey">Loading...</div>
        </div>
        <button class="icon-btn" onclick="copyKey()">📋 COPY</button>
      </div>

      <!-- Subscription Metadata -->
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px;">
        <div class="card" style="padding: 10px;">
          <div style="font-size: 10px; color: var(--text-sub);">ACTIVATED</div>
          <div style="font-weight: 700; font-size: 11px; margin-top: 4px;" id="actDate">--</div>
        </div>
        <div class="card" style="padding: 10px;">
          <div style="font-size: 10px; color: var(--text-sub);">EXPIRES</div>
          <div style="font-weight: 700; font-size: 11px; margin-top: 4px;" id="expDate">--</div>
        </div>
        <div class="card" style="padding: 10px;">
          <div style="font-size: 10px; color: var(--text-sub);">DEVICE</div>
          <div style="font-weight: 700; font-size: 10px; margin-top: 4px; word-break: break-all;" id="deviceName">--</div>
        </div>
      </div>

      <!-- Add Subscription Button (Opens Happ Proxy App) -->
      <div class="card" style="background: #ffffff; color: #000; display: flex; justify-content: space-between; align-items: center; padding: 18px; cursor: pointer;" onclick="openHappProxyApp()">
        <div>
          <div style="font-family: 'Teko', sans-serif; font-size: 22px; line-height: 1;">ADD SUBSCRIPTION</div>
          <div style="font-size: 11px; color: #555;">opens happ proxy app with your key ready</div>
        </div>
        <div style="background: #e0e0e0; width: 36px; height: 36px; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold;">+</div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <a href="home.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>HOME</span>
      </a>
      <a href="features.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        <span>FEATURES</span>
      </a>
      <a href="manage.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
        <span>MANAGE</span>
      </a>
    </div>
  </div>

  <script>
    const dataStr = localStorage.getItem("drake_key_data");
    
    if(dataStr) {
      const keyData = JSON.parse(dataStr);
      
      document.getElementById("userKey").innerText = keyData.key || "N/A";

      if(keyData.activatedAt) {
        document.getElementById("actDate").innerText = new Date(keyData.activatedAt).toLocaleDateString();
      }

      if(keyData.expiresAt) {
        const expTime = new Date(keyData.expiresAt).getTime();
        document.getElementById("expDate").innerText = new Date(expTime).toLocaleString();

        // Live Countdown Timer Loop
        function updateTimer() {
          const now = Date.now();
          const timeLeftMs = expTime - now;

          if(timeLeftMs > 0) {
            const totalSecs = Math.floor(timeLeftMs / 1000);
            const days = Math.floor(totalSecs / (3600 * 24));
            const hours = Math.floor((totalSecs % (3600 * 24)) / 3600);
            const mins = Math.floor((totalSecs % 3600) / 60);
            const secs = totalSecs % 60;

            if(days > 0) {
              document.getElementById("timeLeft").innerText = `${days}D ${hours}H`;
            } else {
              document.getElementById("timeLeft").innerText = `${hours}H ${mins}M ${secs}S`;
            }
          } else {
            document.getElementById("timeLeft").innerText = "EXPIRED";
          }
        }
        updateTimer();
        setInterval(updateTimer, 1000);
      }

      if(keyData.device) {
        document.getElementById("deviceName").innerText = keyData.device;
      }
    } else {
      window.location.href = "index.html";
    }

    function copyKey() {
      const key = document.getElementById("userKey").innerText;
      navigator.clipboard.writeText(key);
      alert("Key copied to clipboard!");
    }

    // Open Happ Proxy App & Copy Key for subscription
    function openHappProxyApp() {
      const key = document.getElementById("userKey").innerText;
      navigator.clipboard.writeText(key);
      
      // Try launching Happ Proxy App via custom scheme or fallback to universal intent
      window.location.href = "happ://";
      
      setTimeout(() => {
        alert("Key copied! If Happ Proxy App didn't open automatically, please open it manually and paste your key.");
      }, 500);
    }
  </script>
</body>
</html>
