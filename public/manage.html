<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRAKE - Manage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="mobile-container">
    <div class="header">
      <h1>MANAGE</h1>
      <div class="header-icons">
        <button class="icon-btn">🔔</button>
        <button class="icon-btn">🌐 EN</button>
      </div>
    </div>

    <div class="content">
      <!-- Hardware Lock Card (Dynamic based on login) -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 10px; color: var(--text-sub);">THIS DEVICE</span>
          <span style="font-size: 9px; background: #262a33; color: var(--text-sub); padding: 2px 6px; border-radius: 4px; font-weight: 700;">LOCKED TO THIS KEY</span>
        </div>
        <div style="font-family: 'Teko', sans-serif; font-size: 26px; line-height: 1; letter-spacing: 1px;" id="deviceNameDisplay">LOADING...</div>
        <div style="font-size: 12px; color: var(--text-sub); margin-top: 2px;" id="deviceOS">--</div>
        <div style="font-size: 11px; color: #555; margin-top: 4px;" id="deviceToken">--</div>

        <div style="margin-top: 14px; text-align: center; font-size: 10px; color: var(--text-sub); letter-spacing: 1px;" id="resetInfo">
          --
        </div>
      </div>

      <!-- Update Log -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; font-size: 10px; color: var(--text-sub); margin-bottom: 8px;">
          <span>UPDATE NOTES</span>
          <span style="color: #fff; cursor: pointer;">ALL UPDATES ></span>
        </div>
        <div style="font-family: 'Teko', sans-serif; font-size: 18px; color: #fff;">DM ONLY TELEGRAM CHANNEL</div>
        <div style="font-size: 11px; color: var(--text-sub); margin-top: 4px;">for any query or subscription support, please check our official telegram channel below...</div>
      </div>

      <!-- Setup Guide Link -->
      <div class="card" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
        <div>
          <div style="font-family: 'Teko', sans-serif; font-size: 18px; line-height: 1;">SETUP GUIDE</div>
          <div style="font-size: 11px; color: var(--text-sub);">get the app and connect</div>
        </div>
        <div style="font-size: 16px;">▶</div>
      </div>

      <div style="font-size: 10px; color: var(--text-sub); margin-top: 20px; margin-bottom: 8px; letter-spacing: 1px;">COMMUNITY</div>

      <!-- Telegram Channel Button -->
      <div class="card" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 10px;" onclick="window.open('https://t.me/+rd5guGEUyR41MzA1', '_blank')">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="background: #181b22; width: 32px; height: 32px; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-weight: 700; color: #00e5ff;">T</div>
          <span style="font-family: 'Teko', sans-serif; font-size: 20px;">TELEGRAM CHANNEL</span>
        </div>
        <div>↗</div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <a href="home.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>HOME</span>
      </a>
      <a href="features.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        <span>FEATURES</span>
      </a>
      <a href="manage.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
        <span>MANAGE</span>
      </a>
    </div>
  </div>

  <script>
    // LocalStorage se key data read karein jo login ke time save hua tha
    const dataStr = localStorage.getItem("drake_key_data");
    
    if(dataStr) {
      const keyData = JSON.parse(dataStr);

      // Device Name Display
      if(keyData.device) {
        document.getElementById("deviceNameDisplay").innerText = keyData.device.toUpperCase();
        document.getElementById("deviceOS").innerText = keyData.device.includes("iOS") || keyData.device.includes("iPhone") ? "iOS" : "Android / PC";
      } else {
        document.getElementById("deviceNameDisplay").innerText = "CONNECTED DEVICE";
        document.getElementById("deviceOS").innerText = "Verified Session";
      }

      // Unique Token Display
      document.getElementById("deviceToken").innerText = keyData.key ? "KEY: " + keyData.key : "2zd29jp7697olnld";

      // Reset Info based on Expiry
      if(keyData.expiresAt && keyData.expiresAt !== "LIFETIME") {
        const expDate = new Date(keyData.expiresAt).toLocaleDateString();
        document.getElementById("resetInfo").innerText = "EXPIRY / RESET: " + expDate;
      } else {
        document.getElementById("resetInfo").innerText = "LIFETIME ACCESS - NO RESET REQUIRED";
      }
    } else {
      // Agar bina login kiye direct khola ho
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
