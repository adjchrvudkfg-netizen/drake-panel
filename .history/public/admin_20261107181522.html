<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRAKE - Admin Panel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="mobile-container">
    <div class="header">
      <h1>ADMIN PANEL</h1>
    </div>

    <div class="content">
      <!-- Admin Login Box -->
      <div id="loginBox" class="card">
        <div style="font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #fff;">ADMIN SECURITY LOGIN</div>
        <div style="font-size: 11px; color: var(--text-sub); margin-bottom: 6px;">USERNAME</div>
        <input type="text" id="adminUser" placeholder="Enter username..." style="width: 100%; background: #090a0c; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 12px; box-sizing: border-box;">
        
        <div style="font-size: 11px; color: var(--text-sub); margin-bottom: 6px;">PASSWORD</div>
        <input type="password" id="adminPass" placeholder="Enter password..." style="width: 100%; background: #090a0c; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 14px; box-sizing: border-box;">
        
        <button onclick="verifyAdminLogin()" style="width: 100%; background: #fff; color: #000; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; text-transform: uppercase;">LOGIN</button>
        <div id="loginError" style="color: #ff4d4d; font-size: 11px; margin-top: 8px; display: none;"></div>
      </div>

      <!-- Main Admin Panel (Hidden until login) -->
      <div id="panelBox" style="display: none;">
        <div class="card">
          <div style="font-size: 11px; color: var(--text-sub); margin-bottom: 6px;">NUMBER OF KEYS TO GENERATE</div>
          <select id="keyCount" style="width: 100%; background: #090a0c; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 12px;">
            <option value="1">1 Key</option>
            <option value="5">5 Keys</option>
            <option value="10" selected>10 Keys</option>
            <option value="20">20 Keys</option>
            <option value="50">50 Keys</option>
            <option value="100">100 Keys</option>
          </select>

          <div style="font-size: 11px; color: var(--text-sub); margin-bottom: 6px;">DURATION VALUE & TYPE</div>
          <div style="display: flex; gap: 8px; margin-bottom: 14px;">
            <input type="number" id="durationValue" value="24" min="1" style="flex: 1; background: #090a0c; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 6px; box-sizing: border-box;" placeholder="e.g. 2, 12, 24">
            <select id="durationType" style="flex: 1; background: #090a0c; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 6px;">
              <option value="hours">Hours</option>
              <option value="days" selected>Days</option>
            </select>
          </div>

          <button onclick="generateKeys()" style="width: 100%; background: #fff; color: #000; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; text-transform: uppercase;">GENERATE KEYS</button>
        </div>

        <!-- Generated Keys Result Box -->
        <div id="resultBox" class="card" style="display: none; background: #181b22;">
          <div style="font-size: 10px; color: var(--text-sub); margin-bottom: 6px;">GENERATED KEYS (BULK)</div>
          <div id="newKeyDisplay" style="font-size: 13px; font-weight: 700; color: #00e5ff; max-height: 120px; overflow-y: auto; margin-bottom: 10px; line-height: 1.6;"></div>
          <button class="icon-btn" onclick="copyGenKeys()">COPY ALL KEYS</button>
        </div>

        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span style="font-size: 11px; color: var(--text-sub);">ALL CREATED KEYS</span>
            <button onclick="loadKeys()" class="icon-btn">REFRESH</button>
          </div>
          <div id="keyList" style="font-size: 11px; max-height: 220px; overflow-y: auto;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function verifyAdminLogin() {
      const username = document.getElementById('adminUser').value.trim();
      const password = document.getElementById('adminPass').value.trim();
      const errDiv = document.getElementById('loginError');

      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if(data.success) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('panelBox').style.display = 'block';
        loadKeys();
      } else {
        errDiv.innerText = data.message;
        errDiv.style.display = 'block';
      }
    }

    async function generateKeys() {
      const count = document.getElementById('keyCount').value;
      const durationValue = document.getElementById('durationValue').value;
      const durationType = document.getElementById('durationType').value;

      const res = await fetch('/api/admin/generate-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ count, durationValue, durationType })
      });

      const data = await res.json();
      if(data.success) {
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('newKeyDisplay').innerHTML = data.keys.join('<br>');
        loadKeys();
      } else {
        alert("Error generating keys");
      }
    }

    async function loadKeys() {
      const res = await fetch('/api/admin/list-keys');
      const data = await res.json();
      if(data.success) {
        let html = '';
        data.keys.reverse().forEach(k => {
          const expDate = new Date(k.expiresAt).toLocaleString();
          html += `<div style="padding: 8px 0; border-bottom: 1px solid #1e2229;">
            <div style="font-weight:700; color:#fff;">${k.key}</div>
            <div style="color:#7a8290; font-size:10px;">Expires: ${expDate}</div>
          </div>`;
        });
        document.getElementById('keyList').innerHTML = html;
      }
    }

    function copyGenKeys() {
      const text = document.getElementById('newKeyDisplay').innerText;
      navigator.clipboard.writeText(text);
      alert("All generated keys copied to clipboard!");
    }
  </script>
</body>
</html>
